    <!--
      Sløret som dekker appen mens den starter: gradienten og ordmerket i systemskrift, med CSS rett her, så det står fra første bilde, før én eneste fil er lastet (den tekniske
      revisjonen 01.10, funn 5c: første innhold kom etter 5,4 s på mobilnett, fordi ingenting kunne males før all JavaScript var kjørt). Det er det samme elementet hele tiden: appen løfter
      det (`liftVeil`, src/ui/lib/veil.ts) ved å legge `is-gone` på det når kuben er tegnet, og grensen rundt appen gjør det samme når noe krasjer. Fargene er verdiene til tokenene
      --kube-color-ground og --kube-color-veil og blekket til --kube-color-text (design-system/tokens.json; src/ui/veil.test.ts holder dem like), og ordmerket står på plassen til
      `.scr-wordmark` i toppfeltet (56 px høyt, 52 liggende). Reglene står i kolonne 0, så testen finner dem.
    -->
    <style>html,body{background:#0b0b0c;height:100%;margin:0}.veil{z-index:20;pointer-events:none;background:radial-gradient(70% 60% at 50% 45%,#1d1c1a 0%,#0b0b0c 70%);transition:opacity .9s cubic-bezier(.16,1,.3,1),visibility 0s linear .9s;position:fixed;inset:0}.veil.is-gone{opacity:0;visibility:hidden;transition:opacity .75s cubic-bezier(.16,1,.3,1) .15s,visibility 0s linear .9s}.veil:before{content:"";background:radial-gradient(ellipse 120% 62% at 50% 100%, var(--veil-glow,transparent) 0%, transparent 100%), radial-gradient(ellipse 90% 45% at 50% 0%, var(--veil-top,transparent) 0%, transparent 100%);opacity:0;animation:1.4s cubic-bezier(.2,.8,.2,1) .15s forwards veil-glow;position:absolute;inset:0}@keyframes veil-glow{to{opacity:1}}.veil-mark{filter:opacity()}.veil.is-gone .veil-mark{filter:opacity(0);transition:filter .15s linear}.veil-mark{left:calc(4px + env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 28px);opacity:.28;width:98.8px;height:15px;animation:2.4s cubic-bezier(.2,.8,.2,1) infinite veil-breathe;display:block;position:absolute;transform:translateY(-50%)}.veil.is-gone .veil-mark{animation-play-state:paused}@media (height<=520px) and (aspect-ratio>=1){.veil-mark{top:calc(env(safe-area-inset-top,0px) + 26px)}}@media (prefers-reduced-motion:reduce){.veil-mark{opacity:.45;animation:none}.veil:before{opacity:1;animation:none}}@keyframes veil-breathe{0%,to{opacity:.28}50%{opacity:.62}}</style>

    <script id="startvakt">
      // Vakt for oppstarten (teknisk helse 09.11, punkt 2). Står her, uten imports, så den virker også når hovedfila aldri kjørte: en fil som ikke lastes, en nettleser som ikke forstår koden, eller grafikk som henger.
      // Appen har startet når sløret er løftet (`is-gone`, `liftVeil` i src/ui/lib/veil.ts; grensen rundt appen løfter det også når noe krasjer og viser sitt eget kort). Før det vises en enkel melding med «Try again»,
      // enten etter 25 s, eller med en gang når en skriptfil ikke lastes, koden ikke kan leses eller nettleseren mangler moduler. Starter appen likevel (tregt nett), tas meldingen bort igjen. Er den startet, rydder vakten etter seg.
      (function () {
        var started = function () {
          var veil = document.getElementById('veil');
          return !!veil && / is-gone /.test(' ' + veil.className + ' ');
        };
        var card = null;
        var poll = 0;
        var done = function () {
          clearInterval(poll);
          window.removeEventListener('error', onError, true);
          if (card && card.parentNode) card.parentNode.removeChild(card);
          card = null;
        };
        var show = function () {
          if (started()) return done();
          if (card) return;
          card = document.createElement('div');
          card.setAttribute('role', 'alert');
          card.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#ECEAE4;font:16px/1.4 system-ui,sans-serif';
          var title = document.createElement('p');
          title.style.cssText = 'margin:0 0 12px;font-size:20px;font-weight:600';
          title.textContent = "Kubelo couldn't start";
          var text = document.createElement('p');
          text.style.cssText = 'margin:0 0 24px;max-width:300px;opacity:.8';
          text.textContent = 'Check your connection and try again. If it keeps happening, update your browser.';
          var button = document.createElement('button');
          button.type = 'button';
          button.style.cssText = 'min-height:48px;padding:0 28px;border:1px solid rgba(236,234,228,.6);border-radius:24px;background:none;color:inherit;font:inherit;font-weight:600';
          button.textContent = 'Try again';
          button.onclick = function () {
            location.reload();
          };
          card.appendChild(title);
          card.appendChild(text);
          card.appendChild(button);
          document.documentElement.appendChild(card);
          // Starter appen likevel, går meldingen bort av seg selv.
          poll = setInterval(function () {
            if (started()) done();
          }, 1000);
        };
        var onError = function (e) {
          var target = e.target;
          if ((target && target.tagName === 'SCRIPT') || (e.error && e.error.name === 'SyntaxError')) show();
        };
        window.addEventListener('error', onError, true);
        if (!('noModule' in document.createElement('script'))) show();
        setTimeout(show, 25000);
      })();
    </script>
