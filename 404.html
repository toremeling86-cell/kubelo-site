<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* «Side for datamaskiner» på en berøringstelefon: Chrome ser bort fra meta viewport og legger siden ut 980 px bred, så den ser ut som på en PC, bare liten.
   Her skaleres siden opp til skjermbredden (CSS-zoom), så telefonutgaven vises. Faktoren står i --kz og i window.kubeloZoom (1 uten skalering): vw, vh og mål fra skript må deles på den.
   Terskelen 1,15: i PC-modus på en telefon er forholdet over 2. Under 1,15 er forskjellen så liten at skalering bare gir støy (nettbrett, smale vinduer). PC-er har fin peker og røres ikke.
   Appen under /play/ har ikke denne biten: testerne bruker den fra Play-butikken, og der finnes ikke PC-modus. */
(function () {
  var d = document.documentElement, T = 1.15, k = window.kubeloZoom = 1;
  function fit() {
    var w = d.clientWidth, s = screen.width, n = matchMedia('(pointer: coarse)').matches && s > 0 && w > s * T ? w / s : 1;
    if (n === k) return;
    window.kubeloZoom = k = n;
    if (n > 1) { d.style.zoom = n; d.style.setProperty('--kz', n); }
    else { d.style.removeProperty('zoom'); d.style.removeProperty('--kz'); }
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
})();
</script>

@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url(/site/fonts/schibsted-grotesk-500.woff2) format('woff2')}

:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#0b1230;color:#f3f1ec}
/* --kz: skaleringen fra pc-modus-biten i <head> (1 uten). I «Side for datamaskiner» på en telefon zoomes siden, og da må vw og vh deles på --kz for å bli det de var. */
body{min-height:calc(100vh / var(--kz,1));min-height:calc(100svh / var(--kz,1));display:flex;flex-direction:column;font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:0;background:#0b1230 url(/site/sky-blue-p.webp) 50% 50%/cover no-repeat}
@media (min-aspect-ratio: 9/10){.sky{background-image:url(/site/sky-blue-l.webp)}}
.sky::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,22,0) 0%,rgba(6,9,22,0) 52%,rgba(6,9,22,.55) 78%,rgba(6,9,22,.86) 100%)}
.h{text-shadow:0 0 2px rgba(8,10,20,.95),0 0 4px rgba(8,10,20,.95),0 0 6px rgba(8,10,20,.9),0 0 8px rgba(8,10,20,.9),0 0 10px rgba(8,10,20,.85),0 0 14px rgba(8,10,20,.8),0 0 22px rgba(8,10,20,.55)}
a{color:#f3f1ec;text-decoration:none}
a:focus-visible{outline:2px solid #f3f1ec;outline-offset:4px;border-radius:6px}
header{position:relative;z-index:1;padding:0 24px;height:68px;display:flex;align-items:center}
.wordmark{display:inline-flex;align-items:center;min-height:48px;font-weight:500;font-size:16px;letter-spacing:.22em}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 24px calc(15vh / var(--kz,1));text-align:center}
h1{margin:0;font-weight:600;font-size:clamp(1.75rem,calc(7vw / var(--kz,1)),2.75rem);line-height:1.1;letter-spacing:-.022em;text-wrap:balance;max-width:14em}
p{margin:0;font-weight:500;font-size:1.0625rem;line-height:1.5;color:#e2e0da;max-width:24em;text-wrap:balance}
.go{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 26px;margin-top:10px}
.go a{display:inline-flex;align-items:center;min-height:48px;padding:0 6px;font-weight:500;font-size:1.0625rem}
</style>
</head>
